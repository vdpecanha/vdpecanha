<svg xmlns="http://www.w3.org/2000/svg" width="840" height="196" viewBox="0 0 840 196" role="img" aria-label="Ouvir, Desenhar, Construir, Ajustar">
<title>Ouvir, Desenhar, Construir, Ajustar</title>
<style>
.up{opacity:0;animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.run{stroke-dasharray:9 91;animation:run 7s linear infinite}
@keyframes run{to{stroke-dashoffset:-100}}
.shine{animation:shine 8s ease-in-out infinite}
@keyframes shine{0%,72%{transform:translateX(-420px)}100%{transform:translateX(1300px)}}
.ln{stroke-dasharray:100;stroke-dashoffset:100;animation:ln 1.4s ease forwards}
@keyframes ln{to{stroke-dashoffset:0}}
.emo{font:22px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.ct{font:700 21px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#EAF0FA}
.cs{font:500 13px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#95A3BA}
.cp{font:700 10.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:1.3px;fill:#6CB6FF}
.cn{font:400 50px Georgia,'Times New Roman',serif;fill:url(#g)}
.cl{font:500 14px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#C4CFE0}
.cf{font:500 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#7F8CA3}
.nn{font:400 46px Georgia,'Times New Roman',serif;fill:url(#g)}
.nl{font:500 13.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#C4CFE0}
.mk{font:400 20px Georgia,'Times New Roman',serif;fill:#6CB6FF}
.mt{font:700 16px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#EAF0FA}
.ms{font:500 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#95A3BA}
.gt{font:700 13.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#EAF0FA}
.pt{font:700 14.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#EAF0FA}
.ps{font:500 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#95A3BA}
.at{font:700 16px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#EAF0FA}
.as{font:500 12px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#95A3BA}
.ap{font:700 9.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:1.2px;fill:#6CB6FF}
.al{font:500 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#C4CFE0}
@keyframes md0{0%,0%{fill:#0F1420;stroke:#2F3B52}3%,90%{fill:#142238;stroke:#6CB6FF}100%{fill:#0F1420;stroke:#2F3B52}}.md0{animation:md0 9s ease infinite}@keyframes md1{0%,24%{fill:#0F1420;stroke:#2F3B52}28%,90%{fill:#142238;stroke:#6CB6FF}100%{fill:#0F1420;stroke:#2F3B52}}.md1{animation:md1 9s ease infinite}@keyframes md2{0%,49%{fill:#0F1420;stroke:#2F3B52}53%,90%{fill:#142238;stroke:#6CB6FF}100%{fill:#0F1420;stroke:#2F3B52}}.md2{animation:md2 9s ease infinite}@keyframes md3{0%,74%{fill:#0F1420;stroke:#2F3B52}78%,90%{fill:#142238;stroke:#6CB6FF}100%{fill:#0F1420;stroke:#2F3B52}}.md3{animation:md3 9s ease infinite}.trilho{stroke-dasharray:100;stroke-dashoffset:100;animation:trilho 9s ease-in-out infinite}@keyframes trilho{0%{stroke-dashoffset:100;opacity:1}75%,92%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}.ponto{animation:ponto 9s ease-in-out infinite}@keyframes ponto{0%{transform:translateX(0);opacity:1}75%{transform:translateX(630.0px);opacity:1}92%{opacity:0}100%{transform:translateX(0);opacity:0}}</style>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A5D3FF"/><stop offset="1" stop-color="#2F6FB8"/></linearGradient>
<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#DCEEFF" stop-opacity="0"/><stop offset=".5" stop-color="#DCEEFF" stop-opacity=".09"/><stop offset="1" stop-color="#DCEEFF" stop-opacity="0"/></linearGradient>
</defs>
<rect x="1" y="1" width="838" height="194" rx="18" fill="#0F1420" stroke="#232D40"/>
<clipPath id="cd"><rect x="1" y="1" width="838" height="194" rx="18"/></clipPath>
<g clip-path="url(#cd)"><g class="shine"><rect x="0" y="-20" width="150" height="236" fill="url(#sh)" transform="skewX(-18)"/></g></g>
<rect class="run" x="1" y="1" width="838" height="194" rx="18" fill="none" stroke="url(#g)" stroke-width="1.6" pathLength="100"/>
<line x1="105.0" y1="62" x2="735.0" y2="62" stroke="#232D40" stroke-width="2"/>
<line class="trilho" x1="105.0" y1="62" x2="735.0" y2="62" stroke="#6CB6FF" stroke-width="2.4" pathLength="100"/>
<circle class="md0" cx="105.0" cy="62" r="22" fill="#0F1420" stroke="#2F3B52" stroke-width="1.6"/><text class="mk" x="105.0" y="69" text-anchor="middle">1</text>
<g class="up" style="animation-delay:0.15s"><text class="mt" x="105.0" y="120" text-anchor="middle">Ouvir</text><text class="ms" x="105.0" y="143" text-anchor="middle">quem usa no dia a dia</text><text class="ms" x="105.0" y="161" text-anchor="middle">e onde trava</text></g>
<circle class="md1" cx="315.0" cy="62" r="22" fill="#0F1420" stroke="#2F3B52" stroke-width="1.6"/><text class="mk" x="315.0" y="69" text-anchor="middle">2</text>
<g class="up" style="animation-delay:0.30s"><text class="mt" x="315.0" y="120" text-anchor="middle">Desenhar</text><text class="ms" x="315.0" y="143" text-anchor="middle">a tela antes do código,</text><text class="ms" x="315.0" y="161" text-anchor="middle">junto de quem vai usar</text></g>
<circle class="md2" cx="525.0" cy="62" r="22" fill="#0F1420" stroke="#2F3B52" stroke-width="1.6"/><text class="mk" x="525.0" y="69" text-anchor="middle">3</text>
<g class="up" style="animation-delay:0.45s"><text class="mt" x="525.0" y="120" text-anchor="middle">Construir</text><text class="ms" x="525.0" y="143" text-anchor="middle">em Next.js e React,</text><text class="ms" x="525.0" y="161" text-anchor="middle">celular primeiro</text></g>
<circle class="md3" cx="735.0" cy="62" r="22" fill="#0F1420" stroke="#2F3B52" stroke-width="1.6"/><text class="mk" x="735.0" y="69" text-anchor="middle">4</text>
<g class="up" style="animation-delay:0.60s"><text class="mt" x="735.0" y="120" text-anchor="middle">Ajustar</text><text class="ms" x="735.0" y="143" text-anchor="middle">com o uso real,</text><text class="ms" x="735.0" y="161" text-anchor="middle">até resolver de vez</text></g>
<circle class="ponto" cx="105.0" cy="62" r="5" fill="#A5D3FF"/>
</svg>
